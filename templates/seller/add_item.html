{% extends "base.html" %}
{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="mb-4" style="font-family: serif;">Add New Item</h2>
            <form method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="name" class="form-label">Item Name</label>
                    <input type="text" class="form-control rounded-0" id="name" name="name" required>
                </div>
                    <div class="mb-3">
                        <label for="category" class="form-label">Category</label>
                        <select class="form-select rounded-0" id="category" name="category" required>
                            <option value="" disabled selected>Select category</option>
                            <option value="Bridal Dress">Bridal Dress</option>
                            <option value="Wedding Guest">Wedding Guest</option>
                            <option value="Graduation">Graduation</option>
                            <option value="Birthday">Birthday</option>
                            <option value="Debut">Debut</option>
                            <option value="Prom">Prom</option>
                            <option value="Vacation">Vacation</option>
                            <option value="Closet drop">Closet drop</option>
                            <option value="Gown">Gown</option>
                            <option value="Filipiniana">Filipiniana</option>
                            <option value="Traditional">Traditional</option>
                            <option value="Casual / Party">Casual / Party</option>
                        </select>
                    </div>
                <div class="mb-3">
                    <label for="size" class="form-label">Size</label>
                    <select class="form-select rounded-0" id="size" name="size" required>
                        <option value="" disabled selected>Select size</option>
                        <option value="XS">XS</option>
                        <option value="S">S</option>
                        <option value="M">M</option>
                        <option value="L">L</option>
                        <option value="XL">XL</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="price" class="form-label">Price / Day (P)</label>
                    <input type="number" step="0.01" class="form-control rounded-0" id="price" name="price" required>
                </div>
                <div class="mb-4">
                    <label for="image" class="form-label">Item Image</label>
                    <input type="file" class="form-control rounded-0" id="image" name="image" accept="image/*">
                </div>
                <button type="submit" class="btn btn-dark rounded-0 w-100">Save Item</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
