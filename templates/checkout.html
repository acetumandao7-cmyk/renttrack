{% extends "base.html" %}
{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="checkout-card p-4">
                <!-- Email row -->
                <div class="d-flex justify-content-between align-items-start mb-1">
                    <span class="text-muted small">Email: <strong>{{ session.get('user_email', '') }}</strong></span>
                    <button class="btn p-0 border-0 text-muted" style="font-size:1.2rem; line-height:1;">&#8942;</button>
                </div>
                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="email-news">
                    <label class="form-check-label text-muted" for="email-news" style="font-size:0.82rem;">
                        Email me with news and offers
                    </label>
                </div>

                <hr class="section-divider">

                <!-- Payment section -->
                <h5 class="mb-1" style="font-family:'Playfair Display',serif; font-weight:400; color:var(--navy);">Payment</h5>
                <p class="text-muted small mb-3">All transaction are secure and encrypted</p>

                <form action="{{ url_for('checkout') }}" method="POST">
                    <input type="hidden" name="customer_email" value="{{ session.get('user_email', '') }}">

                    <!-- Payment box -->
                    <div class="payment-box mb-4">
                        <div class="w-100">
                            <p class="text-muted small text-center mb-3">Select payment method</p>
                            <div class="d-flex flex-column gap-2">
                                <label class="d-flex align-items-center gap-2" style="cursor:pointer; font-size:0.9rem;">
                                    <input type="radio" name="payment_method" value="gcash" class="form-check-input mt-0"> GCash
                                </label>
                                <label class="d-flex align-items-center gap-2" style="cursor:pointer; font-size:0.9rem;">
                                    <input type="radio" name="payment_method" value="cod" class="form-check-input mt-0"> Cash on Delivery
                                </label>
                                <label class="d-flex align-items-center gap-2" style="cursor:pointer; font-size:0.9rem;">
                                    <input type="radio" name="payment_method" value="bank" class="form-check-input mt-0"> Bank Transfer
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Dates -->
                    <div class="mb-3">
                        <label class="form-label">Start Date</label>
                        <input type="date" name="start_date" class="form-control" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Return Date</label>
                        <input type="date" name="return_date" class="form-control" required>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn-checkout">Complete Order</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
