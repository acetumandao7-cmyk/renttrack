{% extends "base.html" %}
{% block content %}
<div class="container my-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 bg-light p-5 rounded-0">
                <i class="bi bi-check-circle-fill text-success display-3 mb-3"></i>
                <h2 class="mb-3" style="font-family: serif;">Order Confirmed!</h2>
                <p class="text-muted mb-4">
                    Thank you for your rental order. A confirmation email with your rental schedule and details has been successfully sent to <strong>{{ email }}</strong>.
                </p>
                <a href="{{ url_for('index') }}" class="btn btn-dark rounded-0 py-2">Back to Home</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
